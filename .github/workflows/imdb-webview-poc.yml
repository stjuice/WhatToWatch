name: Build IMDb WebView POC APK

on:
  workflow_dispatch:
  push:
    branches: [poc-android-web]
    paths:
      - "WhatToWatch/ClientApp/**"
      - ".github/workflows/imdb-webview-poc.yml"
  pull_request:
    paths:
      - "WhatToWatch/ClientApp/**"
      - ".github/workflows/imdb-webview-poc.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WhatToWatch/ClientApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: WhatToWatch/ClientApp/package-lock.json

      # Capacitor 7 compiles with sourceCompatibility 21, so JDK 17 fails to build.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --licenses >/dev/null || true

      - name: Point Gradle at the SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: npm run cap:sync

      - name: Assemble debug APK
        working-directory: WhatToWatch/ClientApp/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: imdb-webview-poc-debug
          path: WhatToWatch/ClientApp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
